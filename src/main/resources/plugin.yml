name: 'zQuests'
version: '${version}'
main: fr.maxlego08.quests.QuestsPlugin
description: The quest plugin with the most features
website: https://groupez.dev
author: Maxlego08
api-version: 1.21
depend:
  - zMenu
softdepend:
  - Runes
  - OneBlock
  - Shops
  - Peche
  - Guilde
  - Economie
  - PlaceholderAPI
  - zJobs
  - WildStacker
  - BlockTracker
  - SuperiorSkyblock2
permissions:
  zquests.premium:
    description: Receive the premium rewards of the quests
    default: false
libraries:
  - org.mariadb.jdbc:mariadb-java-client:3.5.6
